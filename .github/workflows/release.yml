name: release

# Tag v0.1.0 -> a GitHub Release carrying the plugin zip AND a plugins.xml.
#
# The plugins.xml is what turns this repository into a QGIS plugin repository. Users add
#
#     https://github.com/Compute-Visibility-Institute/qgis-label-client/releases/latest/download/plugins.xml
#
# once, and from then on the plugin updates itself like an official one. That URL needs no
# authentication, which is only true because the repository is public -- the alternative
# was a VPN-only host or HTTP Basic auth plus credential distribution plus, on first use,
# a QGIS master password every new annotator would have to be walked through.
#
# qgis-plugin-ci treats a semver pre-release suffix (v0.2.0-beta1) as experimental
# automatically, which gives a canary channel for free.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # qgis-plugin-ci reads the changelog and tag history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Test before releasing
        run: pytest -q

      # ─────────────────────────────────────────────────────────────────────
      # The OAuth client secret, substituted into the ZIP and never into git.
      #
      # It is not confidential -- an installed app's secret ships in every copy
      # and identifies the APP, not the bearer; the allowlist is what grants
      # access. But a value committed to a public repository can only be rotated
      # by rewriting history, so it lives in an Actions secret and is written in
      # here, at the last moment before packaging.
      #
      # AFTER the tests above, deliberately: the suite asserts the source default
      # is empty, and running it against a substituted tree would assert nothing.
      #
      # Absent, the step is a no-op and the release still builds -- a fork
      # without the secret gets a working plugin whose sign-in asks for one,
      # which is better than a release that fails to publish.
      # ─────────────────────────────────────────────────────────────────────
      - name: Substitute the OAuth client secret
        env:
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$OAUTH_CLIENT_SECRET" ]; then
            echo "::warning::OAUTH_CLIENT_SECRET is not set; the released plugin will ask each analyst to supply one."
            exit 0
          fi
          f=qgis_label_client/core/oauth.py
          grep -q '^CLIENT_SECRET = ""$' "$f" || {
            echo "::error::$f no longer has an empty CLIENT_SECRET to substitute; refusing to guess."; exit 1; }
          python - "$f" <<'PY'
          import os, sys, pathlib
          p = pathlib.Path(sys.argv[1])
          p.write_text(p.read_text().replace(
              'CLIENT_SECRET = ""',
              'CLIENT_SECRET = "%s"' % os.environ["OAUTH_CLIENT_SECRET"], 1))
          PY
          echo "substituted (value not echoed)"

      - name: Resolve the tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that does not match metadata.txt
        # Otherwise the plugin manager's upgrade detection, which keys on version=,
        # disagrees with the release name and users silently never get the update.
        run: |
          META=$(sed -n 's/^version=//p' qgis_label_client/metadata.txt | head -1 | tr -d '[:space:]')
          if [ "$META" != "${{ steps.tag.outputs.version }}" ]; then
            echo "metadata.txt version=$META but tag is ${{ steps.tag.outputs.tag }}" >&2
            exit 1
          fi

      - name: Release to GitHub, with a plugins.xml
        env:
          # No secret to configure: the automatic workflow token is enough because the
          # repository is public and the release is public.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --release-tag keeps the two apart on purpose. The version goes into the packaged
        # metadata.txt, where a leading "v" would confuse the plugin manager's version
        # comparison; the tag is what exists in git and is what the release attaches to.
        run: |
          qgis-plugin-ci release "${{ steps.tag.outputs.version }}" \
            --release-tag "${{ steps.tag.outputs.tag }}" \
            --github-token "$GITHUB_TOKEN" \
            --create-plugin-repo
